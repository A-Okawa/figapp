name: PC app (Mac, Windows)

# figapp の PC 版（Mac の figapp.app と Windows の figapp.exe）を作って確かめる。
# - desktop ブランチへの push：試しのビルド。アプリとテストの記録・画面の写真は下書きのリリース「desktop-ci」に置く（公開されない）
# - v で始まるタグ（例 v1.14）：配布用。figcore.py の APP_VERSION と同じ版のタグにする。Mac と Windows の両方ができて
#   テストが通ったら、そのタグのリリースを公開する（どちらかが失敗したら下書きのまま）
on:
  push:
    branches: [desktop]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ids.outputs.version }}
      ci_release: ${{ steps.ids.outputs.ci_release }}
      tag_release: ${{ steps.ids.outputs.tag_release }}
    steps:
      - uses: actions/checkout@v4
      - id: ids
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n "s/^APP_VERSION = '\(.*\)'/\1/p" figcore.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ci_release=$(python3 desktop/ci/release.py ensure desktop-ci 'PC app checks (not for students)' true '')" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match APP_VERSION $version"; exit 1; }
            echo "tag_release=$(python3 desktop/ci/release.py ensure "$GITHUB_REF_NAME" "figapp $GITHUB_REF_NAME" true desktop/release_notes.md)" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: mac
          - os: windows-2025
            target: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      REPORT: report-${{ matrix.target }}
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the packages
        run: |
          mkdir -p "$REPORT"
          {
            python -m pip install --upgrade pip
            if [ "$RUNNER_OS" = macOS ]; then
              # wheels that run on macOS 12 or later (pip would otherwise take e.g. numpy built for macOS 14 or later)
              python -m pip wheel --no-deps -w wheels proxy_tools==0.1.0
              python -m pip download --only-binary=:all: --platform macosx_12_0_arm64 --python-version 3.12 \
                --implementation cp --abi cp312 --abi abi3 --abi none --find-links wheels \
                -r desktop/requirements.txt -c desktop/constraints.txt -d wheels
              python -m pip install --no-index --find-links wheels -r desktop/requirements.txt -c desktop/constraints.txt
            else
              python -m pip install -r desktop/requirements.txt -c desktop/constraints.txt
            fi
          } 2>&1 | tee "$REPORT/pip.log"
          python -m pip freeze > "$REPORT/pip-freeze.txt"
          python -c "import sys, platform; print(sys.version, platform.platform(), platform.machine())" | tee "$REPORT/python.txt"

      - name: Build the app
        run: |
          pyinstaller desktop/figapp.spec --noconfirm --clean 2>&1 | tee "$REPORT/pyinstaller.log"
          du -sh dist/* | tee "$REPORT/size.txt"

      - name: Mac – signature and oldest macOS
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict --verbose=2 dist/figapp.app 2>&1 | tee "$REPORT/codesign-verify.txt"
          codesign -dvv dist/figapp.app 2>&1 | tee "$REPORT/codesign-info.txt"
          python desktop/ci/run_checks.py minos dist/figapp.app

      - name: Browser for the checks
        run: |
          python -m pip install playwright==1.64.1
          python -m playwright install chromium

      - name: Check the server in a browser
        run: python desktop/ci/run_checks.py server

      - name: Check the app window (upload, downloads)
        run: python desktop/ci/run_checks.py window

      - name: Check the save dialog and the stop of the server
        run: python desktop/ci/run_checks.py dialog

      - name: Package (Mac)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out dmg
          ditto dist/figapp.app dmg/figapp.app
          ln -s /Applications dmg/Applications
          hdiutil create -volname "figapp $VERSION" -srcfolder dmg -ov -format UDZO "out/figapp-$VERSION-mac.dmg" 2>&1 | tee "$REPORT/dmg.log"
          hdiutil attach -nobrowse -readonly "out/figapp-$VERSION-mac.dmg" -mountpoint /tmp/figapp-dmg 2>&1 | tee -a "$REPORT/dmg.log"
          codesign --verify --deep --strict --verbose=2 /tmp/figapp-dmg/figapp.app 2>&1 | tee "$REPORT/codesign-verify-dmg.txt"
          ls -la /tmp/figapp-dmg | tee -a "$REPORT/dmg.log"
          hdiutil detach /tmp/figapp-dmg
          ls -la out | tee "$REPORT/out.txt"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        env:
          MSYS_NO_PATHCONV: '1'
        run: |
          mkdir -p out
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [ -f "$ISCC" ] || choco install innosetup --no-progress -y 2>&1 | tail -3
          "$ISCC" "/DAppVersion=$VERSION" desktop/installer.iss 2>&1 | tee "$REPORT/inno.log"
          cp "installer/figapp-$VERSION-windows-setup.exe" out/
          (cd dist && 7z a -tzip "../out/figapp-$VERSION-windows.zip" figapp > /dev/null)
          ls -la out | tee "$REPORT/out.txt"

      - name: Check the installer (Windows)
        if: runner.os == 'Windows'
        run: python desktop/ci/run_checks.py installer "out/figapp-$VERSION-windows-setup.exe"

      - name: Results to the draft release desktop-ci
        if: always()
        run: |
          python -c "import os, shutil; shutil.make_archive(os.environ['REPORT'], 'zip', os.environ['REPORT'])"
          files=("$REPORT.zip")
          for f in out/*; do [ -f "$f" ] && files+=("$f"); done
          python desktop/ci/release.py upload "${{ needs.prepare.outputs.ci_release }}" "${files[@]}"

      - name: Apps to the release of the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: python desktop/ci/release.py upload "${{ needs.prepare.outputs.tag_release }}" out/*

  publish:
    needs: [prepare, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 desktop/ci/release.py publish "${{ needs.prepare.outputs.tag_release }}"
